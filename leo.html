:root {

* {

html,
body {

body {

#background {
    position: fixed;
    inset: -55px;
    background:
        linear-gradient(rgba(255,255,255,.13), rgba(0,0,0,.28)),
        url("https://cdn.discordapp.com/attachments/1545571588324335650/1554981593821741076/background.png?backend=b2&ex=6abedcf6&is=6abd8b76&hm=972742b82fab78bc3398ed4ffe01d94305c15742db0495f7ba7ef7a3f6954d60&") center center / cover no-repeat;

    transform: scale(1.08);
    animation: backgroundMove 18s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
    from {
        transform: scale(1.08) translate3d(-.5%, -.3%, 0);
    }
    to {
        transform: scale(1.13) translate3d(.6%, .4%, 0);
    }

#enter {

#setup {

<script>
    

        const canvas =
            document.getElementById("sparkles");

        const ctx =
            canvas.getContext("2d");


        const sparkleImage =
            new Image();

        sparkleImage.src =
            "https://cdn.discordapp.com/attachments/1545571588324335650/1554983812872798378/cursor.png?backend=b2&ex=6abedf07&is=6abd8d87&hm=7d963468f928ac00053895c9998218051cbeef555755746199a10d6d18551f3b&";


        let particles = [];
        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        let cursorVisible = true;

        function drawStar(x, y, outer = 11, inner = 4) {
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const radius = i % 2 === 0 ? outer : inner;
                const angle = -Math.PI / 2 + i * Math.PI / 5;
                const px = x + Math.cos(angle) * radius;
                const py = y + Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = "#fff";
            ctx.shadowColor = "rgba(255,255,255,.9)";
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function resizeCanvas() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();


        window.addEventListener(
            "mousemove",
            event => {

                cursorX = event.clientX;
                cursorY = event.clientY;
                cursorVisible = true;

                for (
                    let i = 0;
                    i < 1;
                    i++
                ) {

                    particles.push({

                        x: event.clientX,
                        y: event.clientY,

                        size:
                            10 +
                            Math.random() * 10,

                        vx:
                            (Math.random() - 0.5) *
                            1.5,

                        vy:
                            (Math.random() - 0.5) *
                            1.5,

                        life: 1,

                        decay:
                            Math.random() * 0.03 +
                            0.015,

                        rotation:
                            Math.random() *
                            Math.PI *
                            2,

                        spin:
                            (Math.random() - 0.5) *
                            0.05

                    });

                }

            }
        );


        function animate() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            particles =
                particles.filter(p => {

                    p.x += p.vx;
                    p.y += p.vy;

                    p.life -= p.decay;

                    p.rotation += p.spin;


                    if (p.life <= 0) {

                        return false;

                    }


                    if (
                        sparkleImage.complete &&
                        sparkleImage.naturalWidth
                    ) {

                        ctx.save();

                        ctx.globalAlpha =
                            p.life;


                        ctx.translate(
                            p.x,
                            p.y
                        );


                        ctx.rotate(
                            p.rotation
                        );


                        ctx.drawImage(

                            sparkleImage,

                            -p.size,
                            -p.size,

                            p.size,
                            p.size

                        );


                        ctx.restore();

                    }


                    else {
                        drawStar(p.x, p.y, p.size, p.size * 0.4);
                    }

                    return true;

                });

            // Keep a visible cursor marker at the current pointer position,
            // even when the original cursor image is unavailable.
            if (cursorVisible) {
                if (sparkleImage.complete && sparkleImage.naturalWidth) {
                    ctx.save();
                    ctx.shadowColor = "rgba(255,255,255,.85)";
                    ctx.shadowBlur = 10;
                    ctx.drawImage(sparkleImage, cursorX - 12, cursorY - 12, 24, 24);
                    ctx.restore();
                } else {
                    drawStar(cursorX, cursorY, 12, 5);
                }
            }

            requestAnimationFrame(
                animate
            );

        }


        animate();


const enter = document.getElementById("enter");
const page = document.getElementById("page");
const audio = document.getElementById("audio");

const playButton = document.getElementById("playButton");
const playIcon = document.getElementById("playIcon");
const volumeSlider = document.getElementById("volumeSlider");
const muteButton = document.getElementById("muteButton");
const volumeIcon = document.getElementById("volumeIcon");

const ICONS = {
    play: "images/icons/play.png",
    pause: "images/icons/pause.png",
    mute: "images/icons/mute.png",
    volume: "images/icons/volume.png"
};

let lastVolume = Number(volumeSlider.value);

const progressFill = document.getElementById("progressFill");
const progressInput = document.getElementById("progressInput");

const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

const background = document.getElementById("background");
const profileImage = document.getElementById("profileImage");
const activityImage = document.getElementById("activityImage");
const songCover = document.getElementById("songCover");

const setup = document.getElementById("setup");

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60).toString().padStart(2, "0");

    return `${minutes}:${secs}`;
}

audio.volume = Number(volumeSlider.value);
audio.muted = false;
volumeIcon.src = ICONS.volume;

function setMuted(muted) {
    if (muted) {
        if (audio.volume > 0) lastVolume = audio.volume;
        audio.muted = true;
        volumeIcon.src = ICONS.mute;
        volumeIcon.alt = "Unmute";
        muteButton.setAttribute("aria-label", "Unmute");
    } else {
        audio.muted = false;
        audio.volume = lastVolume > 0 ? lastVolume : 0.65;
        volumeSlider.value = audio.volume;
        volumeIcon.src = ICONS.volume;
        volumeIcon.alt = "Mute";
        muteButton.setAttribute("aria-label", "Mute");
    }
}

muteButton.addEventListener("click", () => {
    setMuted(!audio.muted);
});

enter.addEventListener("click", async () => {
    enter.classList.add("hidden");
    page.classList.add("visible");

    try {
        await audio.play();
        playIcon.src = ICONS.pause;
        playIcon.alt = "Pause";
    } catch {
        playIcon.src = ICONS.play;
        playIcon.alt = "Play";
    }
});

playButton.addEventListener("click", async () => {
    if (audio.paused) {
        try {
            await audio.play();
            playIcon.src = ICONS.pause;
            playIcon.alt = "Pause";
        } catch {}
    } else {
        audio.pause();
        playIcon.src = ICONS.play;
        playIcon.alt = "Play";
    }
});

volumeSlider.addEventListener("input", () => {
    audio.volume = Number(volumeSlider.value);
    audio.muted = false;
    volumeIcon.src = ICONS.volume;

    function setMuted(muted) {
        if (muted) {
            if (audio.volume > 0) lastVolume = audio.volume;
            audio.muted = true;
            volumeIcon.src = ICONS.mute;
            volumeIcon.alt = "Unmute";
            muteButton.setAttribute("aria-label", "Unmute");
        } else {
            audio.muted = false;
            audio.volume = lastVolume > 0 ? lastVolume : 0.65;
            volumeSlider.value = audio.volume;
            volumeIcon.src = ICONS.volume;
            volumeIcon.alt = "Mute";
            muteButton.setAttribute("aria-label", "Mute");
        }
    }

    muteButton.addEventListener("click", () => {
        setMuted(!audio.muted);
    });
});

audio.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
    currentTime.textContent = formatTime(audio.currentTime);

    if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;

        if (document.activeElement !== progressInput) {
            progressInput.value = percent;
        }
    }
});

progressInput.addEventListener("input", () => {
    if (!audio.duration) return;

    const percent = Number(progressInput.value);
    audio.currentTime = (percent / 100) * audio.duration;
    progressFill.style.width = `${percent}%`;
    currentTime.textContent = formatTime(audio.currentTime);
});

progressInput.addEventListener("change", () => {
    if (!audio.duration) return;

    const percent = Number(progressInput.value);
    audio.currentTime = (percent / 100) * audio.duration;
});

audio.addEventListener("ended", () => {
    playIcon.src = ICONS.play;
    playIcon.alt = "Play";
});

document.getElementById("backgroundPicker").addEventListener("change", event => {
    const file = event.target.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);

    background.style.backgroundImage =
        `linear-gradient(rgba(255,255,255,.13), rgba(0,0,0,.28)), url("${url}")`;
});

document.getElementById("profilePicker").addEventListener("change", event => {
    const file = event.target.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);

    profileImage.src = url;
    activityImage.src = url;
    songCover.src = url;
});

document.getElementById("musicPicker").addEventListener("change", event => {
    const file = event.target.files[0];

    if (!file) return;

    audio.src = URL.createObjectURL(file);
    audio.load();
});

document.addEventListener("keydown", event => {
    if (event.key.toLowerCase() === "u") {
        setup.classList.toggle("open");
    }

    if (event.code === "Space" && document.activeElement.tagName !== "INPUT") {
        event.preventDefault();

        if (audio.paused) {
            audio.play().catch(() => {});
            playIcon.src = ICONS.pause;
            playIcon.alt = "Pause";
        } else {
            audio.pause();
            playIcon.src = ICONS.play;
            playIcon.alt = "Play";
        }
    }
});
</script>

</body>
</html>
