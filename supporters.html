        /* =========================
           HEADER
        ========================= */

        .supporters-header {

                10px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .supporters-header h1 {

                    4vw,
                    48px
                );

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #fff;

            border: 1px solid #fff;

            padding:

                14px;

            font-size: 13px;

            letter-spacing: 1px;

            text-transform: uppercase;

            transition:

                color 0.2s ease;

        }


        .home-link:hover {

            background: #fff;

            color: #000;

        }


        /* =========================
           SUPPORTER GRID
        ========================= */

        .supporters-grid {

            width: 100%;

            max-width: 1600px;

            margin: 0 auto;

            padding: 20px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;

        }


        .supporter-card {

            overflow: hidden;

            scroll-margin-top: 20px;

        }


        .supporter-card img {

            width: 100%;

            height: auto;

            display: block;

            cursor: pointer;

            transition:
                transform 0.2s ease;

        }


        .supporter-card img:hover {

            transform: scale(1.02);

        }


        /* =========================
           IMAGE MODAL
        ========================= */

        .image-modal-overlay {

            position: fixed;

            inset: 0;

            z-index: 5000;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.85
                );

            display: flex;

            align-items: center;

            justify-content: center;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;

        }


        .image-modal-overlay.active {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

        }


        .expanded-image {

            max-width: 90%;

            max-height: 85vh;

            object-fit: contain;

            border-radius: 4px;

            box-shadow:
                0 4px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.5
                );

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .supporters-header {

                padding:
                    18px
                    12px
                    8px;

            }


            .supporters-grid {

                padding: 12px;

                grid-template-columns:
                    1fr;

            }

        }

    
        /* =========================
           SHARED SITE NAVIGATION
        ========================= */
        .site-nav {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 5000;
        }
        .nav-toggle {
            appearance: none;
            background: rgba(0,0,0,.78);
            color: #fff;
            border: 1px solid rgba(255,255,255,.8);
            padding: 11px 15px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: .2s;
        }
        .nav-toggle:hover,.nav-toggle:focus-visible { background:#fff; color:#000; outline:none; }
        .nav-menu {
            position:absolute; top:calc(100% + 7px); left:0; width:220px; display:none;
            background:rgba(0,0,0,.92); border:1px solid rgba(255,255,255,.35);
            backdrop-filter:blur(18px); box-shadow:0 20px 60px rgba(0,0,0,.5);
        }
        .site-nav:hover .nav-menu,.site-nav:focus-within .nav-menu,.site-nav.open .nav-menu { display:block; }
        .nav-menu a { display:block; padding:13px 15px; color:#fff; text-decoration:none; font-size:11px; letter-spacing:1.3px; text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,.10); transition:.2s; }
        .nav-menu a:last-child { border-bottom:0; }
        .nav-menu a:hover,.nav-menu a.active { background:#fff; color:#000; }

    <!-- =========================
         IMAGE ZOOM JAVASCRIPT
    ========================= -->

    <script>

        const modal =
            document.getElementById(
                "imageModal"
            );


        const expandedImage =
            document.getElementById(
                "expandedImg"
            );


        const supporterImages =
            document.querySelectorAll(
                ".supporter-card img"
            );


        supporterImages.forEach(
            image => {

                image.addEventListener(
                    "click",
                    () => {

                        expandedImage.src =
                            image.src;

                        expandedImage.alt =
                            image.alt;

                        modal.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


        modal.addEventListener(
            "click",
            () => {

                modal.classList.remove(
                    "active"
                );

                expandedImage.src = "";

            }
        );


        /* Close with Escape */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    modal.classList.remove(
                        "active"
                    );

                    expandedImage.src = "";

                }

            }
        );


        /* =========================
           AUDIO — START IMMEDIATELY
           ========================= */

        const AUDIO_VOLUME = 0.5;
        const AUDIO_START_TIME = 0;

        const audio =
            document.getElementById("siteAudio");

        const splashScreen =
            document.getElementById("splashScreen");

        const enterButton =
            document.getElementById("enterButton");


        audio.volume = AUDIO_VOLUME;
        audio.currentTime = AUDIO_START_TIME;

        // Keep the exact starting position from the second file.
        audio.currentTime = AUDIO_START_TIME;

        function startSiteAudio() {
            audio.volume = AUDIO_VOLUME;

            // Only reset if the browser has not already started it.
            if (audio.paused) {
                audio.play().catch(error => {
                    // Browsers may block autoplay with sound until the
                    // visitor interacts with the page.
                    console.log("Autoplay was blocked:", error);
                });
            }
        }

        // Try as soon as the page is loaded.
        window.addEventListener("DOMContentLoaded", startSiteAudio);

        // Also try when returning to the page through browser navigation.
        window.addEventListener("pageshow", startSiteAudio);

        // If autoplay is blocked, the first interaction starts it.
        ["pointerdown", "keydown", "touchstart"].forEach(eventName => {
            window.addEventListener(eventName, startSiteAudio, {
                once: true,
                passive: true
            });
        });

    </script>


    <script>
    const navToggle = document.querySelector(".nav-toggle");
    const siteNav = document.querySelector(".site-nav");
    if (navToggle && siteNav) {
        navToggle.addEventListener("click", () => {
            const open = navToggle.getAttribute("aria-expanded") === "true";
            navToggle.setAttribute("aria-expanded", String(!open));
            siteNav.classList.toggle("open", !open);
        });
        document.addEventListener("click", (event) => {
            if (!siteNav.contains(event.target)) {
                navToggle.setAttribute("aria-expanded", "false");
                siteNav.classList.remove("open");
            }
        });
    }
    </script>
